# Shared settings for proxying to third-party news APIs.
limit_req zone=api burst=20 nodelay;
limit_req_status 429;

# Cache successful responses for 5 minutes, keyed by the client's URL, which
# never contains the API key (it's added by the rewrite or a header).
proxy_cache api_cache;
proxy_cache_key $request_uri;
proxy_cache_valid 200 5m;
proxy_cache_lock on;
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
add_header X-Cache-Status $upstream_cache_status always;
default_type application/json;

proxy_http_version 1.1;
proxy_set_header Host $proxy_host;

# The keys travel in these requests: verify who we're talking to.
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Don't leak browser context upstream (NewsAPI also rejects browser origins).
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
